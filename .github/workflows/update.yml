name: Update IP Lists

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update IP files with retry logic
        run: |
          update_file () {
            URL=$1
            FILE=$2
            TEMP="${FILE}.new"

            echo "Updating $FILE from $URL"

            for i in 1 2 3; do
              echo "Attempt $i..."
              if curl -fsSL --connect-timeout 15 --max-time 60 "$URL" -o "$TEMP"; then
                if [ -s "$TEMP" ]; then
                  mv "$TEMP" "$FILE"
                  echo "Updated $FILE successfully"
                  return 0
                fi
              fi

              if [ "$i" -lt 3 ]; then
                echo "Retrying in 15 minutes..."
                sleep 900
              fi
            done

            echo "Failed to update $FILE. Keeping old version."
            rm -f "$TEMP"
          }

          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/block.lst" "block-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/geoblock.lst" "geoblock-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/hodca.lst" "hodca-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/svc_cloudflare.lst" "svc_cloudflare-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/svc_cloudfront.lst" "-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/svc_digitalocean.lst" "svc_digitalocean-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/svc_discord.lst" "svc_discord-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/svc_hetzner.lst" "svc_hetzner-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/domains/svc_ovh.lst" "svc_ovh-domains.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/cloudflare.lst" "cloudflare-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/cloudfront.lst" "cloudfront-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/ddos_guard.lst" "ddos_guard-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/digitalocean.lst" "digitalocean-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/discord.lst" "discord-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/fastly.lst" "fastly-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/geoblock.lst" "geoblock-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/hetzner.lst" "hetzner-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/hodca.lst" "hodca-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/ipsum.lst" "ipsum-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/ovh.lst" "ovh-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/rkn.lst" "rkn-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/rkn_all.lst" "rkn_all-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/akamai.lst" "akamai-ip.txt"
          update_file "https://raw.githubusercontent.com/xyzmean/ru-bypass-ipsets/refs/heads/main/lists/aws.lst" "aws-ip.txt"
          

      - name: Optimize IP files
        run: |
          find . -maxdepth 1 -type f -name '*-ip.txt' \
            ! -name 'all-ip.txt' \
            ! -name 'main-ip.txt' \
            | sort \
            | while read -r f; do
                echo "Optimizing $f"
                python3 scripts/optimize_ip.py "$f"
              done

      - name: Optimize domain files
        run: |
          find . -maxdepth 1 -type f -name '*-domains.txt' \
            ! -name 'all-domains.txt' \
            ! -name 'main-domains.txt' \
            | sort \
            | while read -r f; do
                echo "Optimizing $f"
                python3 scripts/optimize_domains.py "$f"
              done

      - name: Build merged lists
        run: |
          rm -f all-ip.txt all-domains.txt

          find . -maxdepth 1 -type f -name '*-ip.txt' \
            ! -name 'all-ip.txt' \
            | sort \
            | while read -r f; do
                name="$(basename "$f" .txt)"
                echo "# $name" >> all-ip.txt
                grep -v '^[[:space:]]*#' "$f" >> all-ip.txt || true
                echo >> all-ip.txt
              done

          find . -maxdepth 1 -type f -name '*-domains.txt' \
            ! -name 'all-domains.txt' \
            | sort \
            | while read -r f; do
                name="$(basename "$f" .txt)"
                echo "# $name" >> all-domains.txt
                grep -v '^[[:space:]]*#' "$f" >> all-domains.txt || true
                echo >> all-domains.txt
              done

      - name: Optimize merged IP list
        run: |
          python3 scripts/optimize_ip.py all-ip.txt

      - name: Optimize merged domain list
        run: |
          python3 scripts/optimize_domains.py all-domains.txt

      - name: Commit changes if any
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add *.txt

          if ! git diff --cached --quiet; then
            git commit -m "Update IP lists"
            git push
          else
            echo "No changes detected"
          fi
